<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>wryte repro</title>
    <style>
      body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; padding: 2rem; }
      .editor { display: block; position: relative; min-height: 120px; background: #fff; border: 1px solid #d2d2d7; }
      .editor .ProseMirror { padding: 1rem; min-height: 118px; outline: none; white-space: pre-wrap; word-wrap: break-word; }
      #info { margin-top: 1rem; white-space: pre-wrap; font-family: monospace; font-size: 12px; background: #eee; padding: 8px; }
    </style>
  </head>
  <body>
    <script>
      window.__nativeFocusLog = []
      document.addEventListener('focus', (e) => {
        window.__nativeFocusLog.push('focus on ' + ((e.target && (e.target.className || e.target.tagName)) || '?') + ' at ' + performance.now().toFixed(1))
      }, true)
      document.addEventListener('blur', (e) => {
        window.__nativeFocusLog.push('blur on ' + ((e.target && (e.target.className || e.target.tagName)) || '?') + ' at ' + performance.now().toFixed(1))
      }, true)
    </script>
    <wryte-editor id="e" class="editor" autofocus placeholder="Type here…"></wryte-editor>
    <div id="info"></div>
    <script type="module">
      import './repro.ts'
    </script>
  </body>
</html>
